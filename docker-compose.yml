version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ssdb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ssdb_root_2026
      MYSQL_DATABASE: ssdb
      MYSQL_USER: ssdb
      MYSQL_PASSWORD: ssdb_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pssdb_root_2026"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ssdb-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ssdb_minio
      MINIO_ROOT_PASSWORD: ssdb_minio_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: ssdb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ssdb_minio ssdb_minio_2026;
      mc mb local/encrypted-files --ignore-existing;
      mc mb local/ssdb-bucket --ignore-existing;
      echo 'MinIO buckets initialized';
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssdb-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ssdb?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
      SPRING_DATASOURCE_USERNAME: ssdb
      SPRING_DATASOURCE_PASSWORD: ssdb_pass_2026
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ssdb_minio
      MINIO_SECRET_KEY: ssdb_minio_2026
      MINIO_BUCKET: encrypted-files
      JWT_SECRET: ssdb_jwt_secret_key_2026_08_01_forward_backward_privacy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssdb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
  minio-data:
